<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Útraty</title>
  <meta name="description" content="Osobní evidence útrat po výplatních obdobích.">
  <meta name="theme-color" content="#111111">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Útraty">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/archivo-latin-ext.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply the saved scheme and style before the first paint; the app itself loads later.
    try {
      const settings = JSON.parse(localStorage.getItem('utraty.state') || 'null')?.settings;
      if (typeof settings?.theme === 'string') document.documentElement.dataset.theme = settings.theme;
      if (typeof settings?.style === 'string') document.documentElement.dataset.style = settings.style;
    } catch {
      // No saved data or no storage: the default scheme and style are already in place.
    }
  </script>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/add.css">
  <link rel="stylesheet" href="css/shelf.css">
  <link rel="stylesheet" href="css/overview.css">
  <link rel="stylesheet" href="css/entries.css">
  <link rel="stylesheet" href="css/recurring.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/stats.css">
  <link rel="stylesheet" href="css/stats-chart.css">
  <link rel="stylesheet" href="css/stats-detail.css">
  <link rel="stylesheet" href="css/pastelka.css">
  <link rel="stylesheet" href="css/pastelka-type.css">
  <link rel="stylesheet" href="css/pastelka-views.css">
  <link rel="stylesheet" href="css/pastelka-stats.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <!-- The drawn style shakes every icon's line through this filter. -->
    <filter id="pastelka-rough" x="-25%" y="-25%" width="150%" height="150%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="M12 9l6 6M18 9l-6 6"/></symbol>
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  </svg>

  <div class="app">
    <main class="views">
      <section class="view view--add" id="view-add" aria-labelledby="add-title">
        <header class="rail">
          <h1 class="visually-hidden" id="add-title">Přidat útratu</h1>
          <p class="rail__period" data-bind="period"></p>
          <p class="rail__countdown" data-bind="countdown"></p>
          <div class="rail__strip" aria-hidden="true"><span data-bind="strip"></span></div>
        </header>

        <aside class="install-hint" id="install-hint" hidden>
          <p>Přidej si appku na plochu: v Safari ťukni na <strong>Sdílet</strong> a pak <strong>Přidat na plochu</strong>. Útraty zapsané v Safari se do appky na ploše nepřenesou, převedeš je zálohou v Nastavení.</p>
          <button type="button" class="icon-button" data-action="dismiss-install" aria-label="Skrýt nápovědu">
            <svg class="icon"><use href="#i-close"/></svg>
          </button>
        </aside>

        <div class="tag" id="tag">
          <span class="tag__hole" aria-hidden="true"></span>
          <p class="tag__amount"><output id="amount" aria-live="polite">0</output><span class="tag__currency">Kč</span></p>
          <div class="tag__meta">
            <input class="tag__note" id="note" type="text" placeholder="za co? (nepovinné)" maxlength="200"
              enterkeyhint="done" autocomplete="off" aria-label="Poznámka, za co">
            <label class="tag__date">
              <span id="date-label">Dnes</span>
              <input id="date" type="date" aria-label="Datum útraty">
            </label>
          </div>
        </div>

        <div class="shelf" id="shelf">
          <p class="shelf__hint" id="shelf-hint">Naťukej částku a ťukni na kategorii</p>
          <div class="shelf__labels" id="shelf-labels"></div>
          <div class="picker" id="picker">
            <input class="picker__input" id="picker-input" type="text" role="combobox" aria-expanded="false"
              aria-controls="picker-list" aria-autocomplete="list" aria-label="Hledat kategorii nebo založit novou"
              placeholder="Hledat nebo nová…" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
            <button type="button" class="picker__close icon-button" data-action="close-picker" aria-label="Zavřít hledání">
              <svg class="icon"><use href="#i-close"/></svg>
            </button>
            <ul class="picker__list" id="picker-list" role="listbox" aria-label="Kategorie" hidden></ul>
          </div>
        </div>

        <div class="keypad" id="keypad" role="group" aria-label="Klávesnice pro částku">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button type="button" data-key="," aria-label="Desetinná čárka">,</button>
          <button type="button" data-key="0">0</button>
          <button type="button" data-key="back" aria-label="Smazat poslední číslici">
            <svg class="icon"><use href="#i-back"/></svg>
          </button>
        </div>
      </section>

      <section class="view view--overview" id="view-overview" aria-labelledby="overview-title" hidden>
        <header class="rail rail--nav">
          <button type="button" class="rail__nav" data-action="prev-period" aria-label="Předchozí období">
            <svg class="icon"><use href="#i-left"/></svg>
          </button>
          <div class="rail__center">
            <h1 class="rail__period" id="overview-title" data-bind="period"></h1>
            <p class="rail__status" data-bind="status"></p>
          </div>
          <button type="button" class="rail__nav" data-action="next-period" aria-label="Další období">
            <svg class="icon"><use href="#i-right"/></svg>
          </button>
        </header>
        <div class="overview" id="overview"></div>
      </section>

      <section class="view view--stats" id="view-stats" aria-labelledby="stats-title" hidden>
        <header class="rail">
          <h1 class="rail__period" id="stats-title">Statistiky</h1>
          <p class="rail__status" data-bind="status"></p>
        </header>
        <div class="stats" id="stats"></div>
      </section>

      <section class="view view--settings" id="view-settings" aria-labelledby="settings-title" hidden>
        <header class="rail">
          <h1 class="rail__period" id="settings-title">Nastavení</h1>
        </header>
        <div class="settings" id="settings"></div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden>
      <p class="toast__text" id="toast-text"></p>
      <input class="toast__input" id="toast-input" type="text" maxlength="200" enterkeyhint="done" autocomplete="off" hidden>
      <button type="button" class="toast__secondary" id="toast-secondary" hidden></button>
      <button type="button" class="toast__action" id="toast-action">Vrátit</button>
    </div>

    <nav class="tabs" aria-label="Hlavní nabídka">
      <button type="button" class="tab" data-view="add" aria-current="page">Přidat</button>
      <button type="button" class="tab" data-view="overview">Přehled</button>
      <button type="button" class="tab" data-view="stats">Statistiky</button>
      <button type="button" class="tab" data-view="settings">Nastavení</button>
    </nav>
  </div>

  <noscript>Útraty potřebují zapnutý JavaScript.</noscript>
</body>
</html>
